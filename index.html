<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#210b35"><title>Roberta • 15 anos | Convite encantado</title><style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@400;500;600&display=swap');
:root{--gold:#f4d995;--deep:#1a092d;--purple:#4e186e}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at center,#5e2b78,#11071c 75%);color:#fff;font-family:Montserrat,Arial,sans-serif;display:grid;place-items:center;overflow:hidden}button,a{-webkit-tap-highlight-color:transparent}button{cursor:pointer}.stage{position:relative;height:100dvh;width:min(100vw,56.9dvh);max-width:560px;overflow:hidden;background:#180924;box-shadow:0 0 100px #0009;isolation:isolate}.poster,.film,.start,.shade,.sparkles{position:absolute;inset:0}.poster{background:url('assets/salao-convite.png') center/100% 100% no-repeat;opacity:0;transform:scale(1.045);transition:opacity 1.5s ease,transform 9s ease}.poster.show{opacity:1;transform:scale(1)}.film{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .75s ease;pointer-events:none}.film.show{opacity:1}.shade{background:linear-gradient(180deg,#10051c77,#2a104044 45%,#16051caa);pointer-events:none}.start{z-index:6;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:16px;text-align:center;padding:28px;background:linear-gradient(160deg,#16071f9a,#2b0b49c7),url('assets/salao-convite.png') center/cover;transition:opacity .8s,visibility .8s}.start.hidden{opacity:0;visibility:hidden;pointer-events:none}.start .crown{font-size:48px;filter:drop-shadow(0 0 18px #f1c76f)}.start h1{font:600 clamp(42px,10vw,65px)/.95 'Cormorant Garamond',Georgia,serif;color:var(--gold);letter-spacing:2px;margin:5px 0 0;text-shadow:0 4px 24px #000}.start p{font:500 15px 'Cormorant Garamond',serif;letter-spacing:5px;color:#fff0cf;margin:0 0 22px}.royal-btn{border:1px solid #f5d992;color:#ffe7aa;background:linear-gradient(135deg,#451460,#1f0a35 45%,#5c1c76);border-radius:999px;padding:15px 24px;font:600 11px Montserrat,Arial,sans-serif;letter-spacing:1.5px;box-shadow:inset 0 0 0 2px #d2a34c44,0 10px 30px #0008,0 0 25px #f3c56733;transition:transform .2s,box-shadow .2s}.royal-btn:hover{transform:translateY(-2px);box-shadow:0 0 28px #e2b75c66}.small{font-size:10px;color:#f7e6ccba;line-height:1.6}.controls{position:absolute;z-index:5;top:16px;right:14px;display:flex;gap:8px;opacity:0;transition:opacity .5s}.controls.show{opacity:1}.icon-btn{width:38px;height:38px;border:1px solid #f6d28e7d;border-radius:50%;color:#ffe5ae;background:#1a082bc7;font-size:17px;backdrop-filter:blur(10px)}.actions{position:absolute;inset:0;z-index:4;opacity:0;pointer-events:none;transition:opacity 1.2s}.actions.show{opacity:1;pointer-events:auto}.hotspot{position:absolute;width:41%;height:8.5%;border:0;background:transparent;border-radius:50px;cursor:pointer}.hotspot:focus-visible{outline:3px solid #fff3b0;outline-offset:1px}.hotspot:active{background:#ffe1a51c}.date{left:6%;top:61.2%}.place{right:6%;top:61.2%}.gifts{left:6%;top:73.3%}.rsvp{right:6%;top:73.3%}.sparkles{pointer-events:none;z-index:3;overflow:hidden;opacity:0;transition:opacity 1s}.sparkles.show{opacity:1}.spark{position:absolute;width:3px;height:3px;border-radius:50%;background:#ffe4a4;box-shadow:0 0 10px 2px #f9c66a;animation:drift var(--d) linear infinite;left:var(--x);top:110%;opacity:.8}@keyframes drift{to{transform:translate(var(--dx),-120dvh);opacity:0}}.modal-wrap{position:absolute;inset:0;z-index:12;background:#0d051cc9;backdrop-filter:blur(12px);display:grid;place-items:center;padding:22px;opacity:0;pointer-events:none;transition:opacity .35s}.modal-wrap.open{opacity:1;pointer-events:auto}.modal{position:relative;width:100%;max-width:425px;max-height:85dvh;overflow:auto;border:1px solid #d6ad63;border-radius:20px;background:radial-gradient(circle at 50% 0%,#5d2577,#280d3e 65%,#170822);box-shadow:0 0 0 5px #d6a14c1f,inset 0 0 45px #f1bc4a12,0 20px 70px #000d;text-align:center;padding:35px 22px 30px}.modal:before,.modal:after{content:'✦';position:absolute;top:12px;color:#f2c976;font-size:21px}.modal:before{left:15px}.modal:after{right:15px}.modal h2{font:600 35px 'Cormorant Garamond',serif;color:#ffe3a3;margin:0 0 15px}.modal p{line-height:1.8;font-size:13px;color:#fff3e2}.modal strong{color:#ffe2a2}.modal .big{font:600 27px 'Cormorant Garamond',serif;color:#ffe2a2}.modal .close{position:absolute;right:12px;top:10px;background:transparent;color:#ffdda0;border:0;font-size:27px}.modal .royal-btn{margin-top:13px;display:inline-block;text-decoration:none;font-size:10px;line-height:1.5}.modal ul{text-align:left;display:inline-block;font-size:13px;line-height:2;color:#fff1e1;padding-left:22px}.modal input{width:100%;padding:13px;border-radius:10px;border:1px solid #c9a16c;background:#170924;color:white;margin:10px 0 5px;font:14px Montserrat}.modal input::placeholder{color:#b6a4c2}.replay{position:absolute;z-index:5;bottom:12px;left:50%;transform:translateX(-50%);border:0;background:#210b38c9;color:#f9e1a3;border-radius:30px;padding:9px 16px;font:10px Montserrat;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity 1s}.replay.show{opacity:1;pointer-events:auto}@media(max-height:600px){.start h1{font-size:38px}.start .crown{font-size:35px}}@media(prefers-reduced-motion:reduce){.spark{animation:none}.poster{transition:opacity .5s;transform:none!important}}
</style></head><body><main class="stage" aria-label="Convite de 15 anos da Roberta"><div class="poster" id="poster"></div><video id="videoA" class="film" playsinline muted preload="auto"></video><video id="videoB" class="film" playsinline muted preload="auto"></video><div class="sparkles" id="sparkles" aria-hidden="true"></div><div class="actions" id="actions"><button class="hotspot date" data-modal="date" aria-label="Ver data e horário"></button><button class="hotspot place" data-modal="place" aria-label="Ver local da festa"></button><button class="hotspot gifts" data-modal="gifts" aria-label="Ver sugestões de presentes"></button><button class="hotspot rsvp" data-modal="rsvp" aria-label="Confirmar presença"></button></div><div class="controls" id="controls"><button class="icon-btn" id="skip" title="Pular animação" aria-label="Pular animação">⏭</button><button class="icon-btn" id="sound" title="Som" aria-label="Ativar ou desativar música">♫</button></div><button class="replay" id="replay">↻ REVER A HISTÓRIA</button><div class="start" id="start"><div class="crown">♛</div><h1>Roberta</h1><p>15 ANOS</p><button class="royal-btn" id="begin">✦ ABRIR CONVITE ENCANTADO ✦</button><div class="small">Uma história mágica espera por você</div></div><section class="modal-wrap" id="modalWrap" role="dialog" aria-modal="true" aria-labelledby="modalTitle" aria-hidden="true"><div class="modal"><button class="close" id="close" aria-label="Fechar">×</button><div id="modalContent"></div></div></section><audio id="music" loop preload="none" src="assets/wedding-harp.mp3"></audio></main><script>
const clips=['assets/cena-01-envelope.mp4','assets/cena-02-princesa.mp4','assets/cena-03-relogio.mp4','assets/cena-04-portas.mp4'];
const a=document.getElementById('videoA'),b=document.getElementById('videoB'),poster=document.getElementById('poster'),actions=document.getElementById('actions'),sparkles=document.getElementById('sparkles'),start=document.getElementById('start'),controls=document.getElementById('controls'),replay=document.getElementById('replay'),music=document.getElementById('music');
let index=0,active=a,waiting=b,ended=false,muted=true;music.volume=.27;
function playClip(i){if(i>=clips.length){finish();return}index=i;active.src=clips[i];active.load();active.classList.add('show');active.play().catch(()=>{finish()});if(i+1<clips.length){waiting.src=clips[i+1];waiting.load()}}
function nextClip(){if(ended)return;if(index+1>=clips.length){finish();return}const old=active;active=waiting;waiting=old;index++;active.classList.add('show');active.play().catch(()=>finish());setTimeout(()=>{old.classList.remove('show');old.pause();},650);if(index+1<clips.length){setTimeout(()=>{waiting.src=clips[index+1];waiting.load()},720)}}
a.addEventListener('ended',()=>{if(active===a)nextClip()});b.addEventListener('ended',()=>{if(active===b)nextClip()});
function finish(){ended=true;a.pause();b.pause();poster.classList.add('show');sparkles.classList.add('show');actions.classList.add('show');replay.classList.add('show');setTimeout(()=>{a.classList.remove('show');b.classList.remove('show');},650);document.getElementById('skip').style.display='none'}
function begin(){ended=false;start.classList.add('hidden');poster.classList.remove('show');sparkles.classList.remove('show');actions.classList.remove('show');replay.classList.remove('show');controls.classList.add('show');document.getElementById('skip').style.display='';a.classList.remove('show');b.classList.remove('show');active=a;waiting=b;playClip(0);if(!muted)music.play().catch(()=>{})}
document.getElementById('begin').addEventListener('click',begin);replay.addEventListener('click',begin);document.getElementById('skip').addEventListener('click',finish);
document.getElementById('sound').addEventListener('click',()=>{muted=!muted;const btn=document.getElementById('sound');btn.textContent=muted?'♫':'♪';btn.title=muted?'Ativar música':'Silenciar música';if(muted){music.pause();a.muted=true;b.muted=true}else{music.play().catch(()=>{btn.title='Adicione assets/wedding-harp.mp3 para ativar a trilha'});a.muted=true;b.muted=true}});
for(let i=0;i<33;i++){const s=document.createElement('span');s.className='spark';s.style.setProperty('--x',Math.random()*100+'%');s.style.setProperty('--dx',(Math.random()-.5)*90+'px');s.style.setProperty('--d',(6+Math.random()*9)+'s');s.style.animationDelay=(-Math.random()*15)+'s';sparkles.appendChild(s)}
const maps='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent('Morada Fest Hall, Rua Tenente Mardônio Souza Silva 562, Morada Nova, Uberlândia MG');const phone='5534984166599';const rsvpText=encodeURIComponent('Olá! Gostaria de confirmar minha presença nos 15 anos da Roberta. ✨');const rsvpLink=`https://wa.me/${phone}?text=${rsvpText}`;
const contents={date:`<h2 id="modalTitle">Uma noite encantada</h2><p>Você é nosso convidado especial para celebrar os</p><div class="big">15 anos da Roberta</div><p><strong>13 de fevereiro de 2027</strong><br>Sábado, às <strong>21 horas</strong></p><p>Prepare-se para viver uma noite inesquecível! ✨</p>`,place:`<h2 id="modalTitle">O nosso castelo</h2><p class="big">Morada Fest Hall</p><p>Rua Tenente Mardônio Souza Silva, 562<br>Morada Nova • Uberlândia – MG<br>CEP 38421-771</p><a class="royal-btn" href="${maps}" target="_blank" rel="noopener noreferrer">✦ ABRIR LOCALIZAÇÃO ✦</a>`,gifts:`<h2 id="modalTitle">Sugestões de presentes</h2><p>Sua presença é o nosso maior presente! Mas, se desejar presentear a Roberta, aqui estão algumas ideias:</p><ul><li>Maquiagens</li><li>Acessórios dourados</li><li>Roupas tamanho 44</li><li>Calçados 39/40</li><li>Perfumes com fragrâncias doces</li></ul><p><strong>Pix:</strong> <span id="pixText">183.758.946-13</span></p><button class="royal-btn" id="copyPix">✦ COPIAR CHAVE PIX ✦</button>`,rsvp:`<h2 id="modalTitle">Confirme sua presença</h2><p>Será uma alegria ter você conosco nesta noite tão especial!</p><input id="guestName" maxlength="80" placeholder="Seu nome (opcional)" aria-label="Seu nome"><button class="royal-btn" id="confirmRsvp">✦ CONFIRMAR PELO WHATSAPP ✦</button><p class="small">A confirmação será enviada pelo WhatsApp.</p>`};
const wrap=document.getElementById('modalWrap'),content=document.getElementById('modalContent');function closeModal(){wrap.classList.remove('open');wrap.setAttribute('aria-hidden','true')}
function openModal(type){content.innerHTML=contents[type];wrap.classList.add('open');wrap.setAttribute('aria-hidden','false');if(type==='gifts'){document.getElementById('copyPix').addEventListener('click',async e=>{try{await navigator.clipboard.writeText('183.758.946-13');e.target.textContent='✓ CHAVE COPIADA'}catch{e.target.textContent='PIX: 183.758.946-13'}})}if(type==='rsvp'){document.getElementById('confirmRsvp').addEventListener('click',()=>{const name=document.getElementById('guestName').value.trim();const text=encodeURIComponent(`Olá! ${name?`Meu nome é ${name} e `:'Eu '}gostaria de confirmar minha presença nos 15 anos da Roberta. ✨`);window.open(`https://wa.me/${phone}?text=${text}`,'_blank','noopener,noreferrer')})}}
document.querySelectorAll('[data-modal]').forEach(btn=>btn.addEventListener('click',()=>openModal(btn.dataset.modal)));document.getElementById('close').addEventListener('click',closeModal);wrap.addEventListener('click',e=>{if(e.target===wrap)closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
</script></body></html>
